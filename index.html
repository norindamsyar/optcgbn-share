<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPTCG.BN inventory</title><style>
body{margin:0;background:#0e1013;color:#f2f3f5;font:15px system-ui,sans-serif}header{padding:20px 16px 8px}h1{margin:0;font-size:22px}
.sub{color:#8e95a3;font-size:13px;margin-top:4px}.note{margin-top:10px;padding:10px 12px;background:#1a1d24;border-radius:10px;font-size:14px;white-space:pre-wrap}
.bar{position:sticky;top:0;background:#0e1013;padding:10px 16px;display:flex;gap:8px;z-index:2}
.bar input,.bar select{flex:1;background:#1a1d24;color:#f2f3f5;border:1px solid #2a2f39;border-radius:10px;padding:10px;font-size:14px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:8px 16px 40px}
.c{background:#1a1d24;border-radius:12px;overflow:hidden;position:relative}.c img{width:100%;display:block;aspect-ratio:5/7;object-fit:cover;background:#252a33}
.q{position:absolute;top:6px;right:6px;background:#e8b84a;color:#000;font-weight:700;border-radius:20px;padding:2px 9px;font-size:13px}
.m{padding:8px 10px}.code{font-weight:600;font-size:13px}.r{color:#e8b84a;font-size:12px;margin-left:4px}.n{color:#8e95a3;font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.p{font-size:13px;margin-top:4px}
footer,#msg{color:#8e95a3;font-size:12px;text-align:center;padding:0 16px 30px}footer{padding-bottom:80px}#msg{padding:30px 16px;font-size:14px}
.ctl{padding:0 10px 10px;display:none}.ctl.on{display:block}.ctl button{background:#e8b84a;color:#000;border:0;border-radius:8px;padding:8px;font-weight:700;width:100%;font-size:13px}
.st{display:none;align-items:center;justify-content:space-between;background:#252a33;border-radius:8px}.st b{padding:0 6px}.st button{width:38px;background:#252a33;color:#f2f3f5;font-size:18px;padding:6px}
#cb{position:fixed;left:0;right:0;bottom:0;background:#1a1d24;border-top:1px solid #2a2f39;padding:10px 16px;display:none;justify-content:space-between;align-items:center;z-index:5}
#cb button,.ov button.go{background:#e8b84a;color:#000;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;z-index:9}.ov.on{display:flex}
.sh{background:#1a1d24;width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 24px;box-sizing:border-box}
.sh input{width:100%;box-sizing:border-box;background:#0e1013;color:#f2f3f5;border:1px solid #2a2f39;border-radius:10px;padding:10px;margin:6px 0;font-size:14px}
.ln{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #2a2f39;font-size:13px;gap:8px}.sh .go{width:100%;margin-top:10px}.sh .x{background:#252a33;color:#f2f3f5;border:0;border-radius:10px;padding:10px;width:100%;margin-top:8px}
.qc{display:inline-flex;align-items:center;gap:4px}.qc button{background:#252a33;color:#f2f3f5;border:0;border-radius:6px;width:28px;height:28px;font-size:16px}.qc .rm{color:#ff5a5f;margin-left:4px}.ln .pr{min-width:64px;text-align:right}.hint{color:#8e95a3;font-size:12px;margin-top:8px}.wa{display:inline-block;margin-top:8px;background:#25d366;color:#000;font-weight:700;padding:10px 14px;border-radius:10px;text-decoration:none}
</style></head><body><header><h1 id="t">Loading...</h1><div class="sub" id="s"></div><div class="note" id="nt" style="display:none"></div></header>
<div id="refs" class="note" style="display:none;margin:0 16px"></div><div class="bar"><input id="q" placeholder="Search code or name" oninput="f()"><select id="st" onchange="f()"><option value="">All sets</option></select></div>
<div id="msg"></div><div class="grid" id="g"></div><footer id="ft"></footer>
<div id="cb"><span id="ct"></span><button onclick="openOrder()">View my cart</button></div>
<div class="ov" id="ov"><div class="sh"><h2 style="margin:0 0 8px">My cart</h2><div id="ol"></div><div id="otot" style="margin:10px 0;font-weight:600"></div>
<input id="bn" placeholder="Your name (required)"><input id="bp" type="tel" inputmode="tel" placeholder="Your WhatsApp number (required) e.g. 6738123456"><input id="bnote" placeholder="Note (optional)">
<div id="res" class="hint" style="color:#f2f3f5;font-size:14px;margin-top:10px"></div><button class="go" id="gobtn" onclick="sendOrder()">Place order</button><button class="x" onclick="closeOrder()">Keep shopping</button>
<div class="hint">Your order goes to the seller for approval. No payment is taken here; the seller will contact you on WhatsApp.</div></div></div>
<script>
var D=null,CART={};
var REPO="norindamsyar/optcgbn-share";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function chg(i,dl){var c=D.cards[i],q=(CART[i]||0)+dl;if(q>c.q)q=c.q;if(q<=0){delete CART[i];q=0}else CART[i]=q;
  var a=document.querySelector('.ad[data-k="'+i+'"]'),s=document.getElementById("st"+i);
  a.style.display=q?"none":"";s.style.display=q?"flex":"none";document.getElementById("sq"+i).textContent=q;upd()}
function tot(){var n=0,t=0;for(var k in CART){n+=CART[k];t+=(D.cards[k].p||0)*CART[k]}return{n:n,t:t}}
function money(t){return D.rate?"B$"+(t*D.rate).toFixed(2):""}
function upd(){var x=tot(),b=document.getElementById("cb");b.style.display=x.n?"flex":"none";
  document.getElementById("ct").textContent=x.n+" card"+(x.n>1?"s":"")+(D.rate?" \u00b7 "+money(x.t):"")}
function lines(){var o=[];for(var k in CART){var c=D.cards[k];o.push({c:c,q:CART[k]})}return o}
function cl(k,d){chg(k,d);if(!tot().n){closeOrder()}else openOrder()}
function openOrder(){var h="";for(var k in CART){var c=D.cards[k],q=CART[k];
    h+='<div class="ln"><span style="flex:1">'+esc(c.c)+" "+esc(c.r)+" "+esc(c.e||c.n)+'</span><span class="qc"><button onclick="cl('+k+',-1)">\u2212</button><b>'+q+'</b><button onclick="cl('+k+',1)">+</button><button class="rm" onclick="cl('+k+',-999)">\u2715</button></span><span class="pr">'+(D.rate&&c.p?money(c.p*q):"")+'</span></div>'}
  document.getElementById("ol").innerHTML=h;var x=tot();document.getElementById("otot").textContent=D.rate?x.n+" cards, total (reference): "+money(x.t):x.n+" cards";
  var bn=document.getElementById("bn"),bp=document.getElementById("bp");if(!bn.value)bn.value=localStorage.getItem("bn")||"";if(!bp.value)bp.value=localStorage.getItem("bp")||"";
  document.getElementById("ov").classList.add("on")}
function closeOrder(){document.getElementById("ov").classList.remove("on");document.getElementById("res").textContent="";var g=document.querySelector(".sh .go");if(g)g.style.display=""}
var API="https://optcgbn-orders.optcgbn.workers.dev";
function waText(id,nm,note,saved){var x=tot();
  var m="*New order "+id+"* - "+(D.name||"OPTCG.BN")+"\nFrom: "+nm+"\n\n";
  lines().forEach(function(l){m+="- "+l.c.c+" "+l.c.r+" "+(l.c.e||l.c.n)+" x"+l.q+(D.rate&&l.c.p?" ("+money(l.c.p*l.q)+")":"")+"\n"});
  m+="\n"+x.n+" cards"+(D.rate?", total "+money(x.t)+" (reference)":"")+"\n";
  if(note)m+="Note: "+note+"\n";
  m+=saved?"\nReview and approve: https://norindamsyar.github.io/optcgbn-share/approve.html?o="+id:"\nPlease confirm availability and payment.";
  return "https://wa.me/"+String(D.wa).replace(/\D/g,"")+"?text="+encodeURIComponent(m)}
function sendOrder(){var nm=document.getElementById("bn").value.trim(),ph=document.getElementById("bp").value.replace(/\D/g,""),res=document.getElementById("res"),go=document.getElementById("gobtn");
  if(!nm){res.textContent="Please enter your name.";document.getElementById("bn").focus();return}
  if(ph.length===7)ph="673"+ph;
  if(ph.length<8||ph.length>15){res.textContent="Please enter a valid WhatsApp number with country code, e.g. 6738123456.";document.getElementById("bp").focus();return}
  if(!tot().n){res.textContent="Your cart is empty.";return}
  localStorage.setItem("bn",nm);localStorage.setItem("bp",ph);var note=document.getElementById("bnote").value.trim();
  var items=lines().map(function(l){return{id:l.c.id,q:l.q}});
  var ok=items.every(function(i){return i.id});
  function fallback(msg){res.innerHTML=esc(msg)+'<br><a class="wa" target="_blank" href="'+waText("O"+Date.now().toString(36).toUpperCase().slice(-5),nm+" (+"+ph+")",note,false)+'">Send on WhatsApp instead</a>'}
  if(!ok){fallback("Direct ordering is not available right now.");return}
  go.disabled=true;res.textContent="Sending...";
  fetch(API+"/order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:nm,phone:ph,note:note,items:items})})
   .then(function(r){return r.json().then(function(j){return{s:r.status,j:j}})})
   .then(function(o){go.disabled=false;
     if(o.s===200){var wl=waText(o.j.id,nm+" (+"+ph+")",note,true);var refs=JSON.parse(localStorage.getItem("refs")||"[]");refs.unshift(o.j.id);localStorage.setItem("refs",JSON.stringify(refs.slice(0,10)));
       CART={};document.querySelectorAll(".ad").forEach(function(b){b.style.display=""});document.querySelectorAll(".st").forEach(function(b){if(b.id!=="st")b.style.display="none"});upd();
       res.innerHTML='<b>Order placed. Ref '+esc(o.j.id)+'</b><br>The seller will review it and contact you on WhatsApp. Tap below to also notify them now.<br><a class="wa" target="_blank" href="'+wl+'">Notify on WhatsApp</a>';
       document.getElementById("ol").innerHTML="";document.getElementById("otot").textContent="";document.querySelector(".sh .go").style.display="none";showRefs()}
     else if(o.s===409||o.s===400||o.s===429)res.textContent=(o.j&&o.j.error)||"Could not place the order.";
     else fallback("Could not reach the seller's order system.")})
   .catch(function(){go.disabled=false;fallback("Could not reach the seller's order system.")})}
function showRefs(){var refs=JSON.parse(localStorage.getItem("refs")||"[]"),el=document.getElementById("refs");if(!refs.length){el.style.display="none";return}
  el.style.display="block";el.textContent="Checking your orders...";
  Promise.all(refs.slice(0,3).map(function(id){return fetch(API+"/status/"+id).then(function(r){return r.ok?r.json():{id:id,status:"expired"}}).catch(function(){return{id:id,status:"unknown"}})}))
   .then(function(a){el.innerHTML=a.map(function(o){return"Order "+esc(o.id)+": <b>"+esc(o.status)+"</b>"}).join("<br>")})}
function load(){
  return fetch("https://api.github.com/repos/"+REPO+"/contents/inventory.json",{headers:{"Accept":"application/vnd.github.raw"}})
   .then(function(r){if(!r.ok)throw 0;return r.json()})
   .catch(function(){return fetch("inventory.json?t="+Date.now()).then(function(r){return r.json()})});
}
function render(d){
  D=d;
  document.getElementById("t").textContent=d.name||"One Piece card inventory";
  document.title=(d.name||"OPTCG.BN")+" - inventory";
  var cards=d.cards||[],n=0,tt=0;cards.forEach(function(c){n+=c.q;tt+=(c.p||0)*c.q});
  var sub=n+" cards \u00b7 "+cards.length+" unique";
  if(d.rate)sub+=" \u00b7 est. value B$"+(tt*d.rate).toLocaleString(undefined,{maximumFractionDigits:2});
  if(d.updated)sub+=" \u00b7 updated "+new Date(d.updated).toLocaleString();
  document.getElementById("s").textContent=sub;
  if(d.note){var nt=document.getElementById("nt");nt.style.display="";nt.textContent=d.note}
  var sets={};cards.forEach(function(c){sets[c.s]=1});var sel=document.getElementById("st");
  Object.keys(sets).forEach(function(s){var o=document.createElement("option");o.textContent=s.toUpperCase();o.value=s;sel.appendChild(o)});
  var h="";cards.forEach(function(c,i){
    var nm=c.e?c.e+" / "+c.n:c.n,p="";
    if(c.p&&d.rate){p="B$"+(c.p*d.rate).toFixed(2);if(d.mode==="both")p+=" (\u00a5"+c.p.toLocaleString()+")"}
    h+='<div class="c" data-s="'+esc(c.s)+'" data-t="'+esc((c.c+" "+c.n+" "+(c.e||"")).toLowerCase())+'">'+
      (c.i?'<img loading="lazy" referrerpolicy="no-referrer" src="'+esc(c.i)+'" alt="">':'')+
      '<span class="q">x'+c.q+'</span><div class="m"><span class="code">'+esc(c.c)+'</span><span class="r">'+esc(c.r)+'</span><div class="n">'+esc(nm)+'</div>'+(p?'<div class="p">'+esc(p)+'</div>':'')+'</div>'+(d.wa?'<div class="ctl on"><button class="ad" data-k="'+i+'" onclick="chg('+i+',1)">Add to order</button><div class="st" id="st'+i+'"><button onclick="chg('+i+',-1)">\u2212</button><b id="sq'+i+'">0</b><button onclick="chg('+i+',1)">+</button></div></div>':'')+'</div>'});
  document.getElementById("g").innerHTML=h;
  document.getElementById("msg").style.display=cards.length?"none":"";
  if(!cards.length)document.getElementById("msg").textContent="No cards published yet.";
  showRefs();
  document.getElementById("ft").textContent=(d.rate?"Prices are Yuyutei shop selling prices converted to BND, for reference only. ":"")+"Made with OPTCG.BN";
}
function f(){var q=document.getElementById("q").value.toLowerCase(),s=document.getElementById("st").value;
  document.querySelectorAll(".c").forEach(function(e){e.style.display=(e.dataset.t.indexOf(q)>-1&&(!s||e.dataset.s==s))?"":"none"})}
load().then(render).catch(function(){document.getElementById("t").textContent="Inventory unavailable";document.getElementById("msg").textContent="Could not load the inventory. Try again later."});
</script></body></html>
